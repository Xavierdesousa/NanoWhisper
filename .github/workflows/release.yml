name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Import signing certificate
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain

          echo "$SIGNING_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

          rm "$CERT_PATH"

      - name: Build, bundle, sign & zip
        run: |
          ZIP=$(make -s release-zip-name)
          # The zip is named from Resources/Info.plist; it must match the pushed tag, or the
          # auto-updater would keep offering this release to the version it installs.
          if [ "$ZIP" != "NanoWhisper-${GITHUB_REF_NAME}.zip" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in Resources/Info.plist ($ZIP)"
            exit 1
          fi
          make release
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      # The release may already exist, e.g. created locally with `make publish` while
      # the runner was unavailable: then only attach the zip if it is missing.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -xF "$ZIP" > /dev/null; then
              echo "::notice::Release $GITHUB_REF_NAME already has $ZIP; nothing to do."
            else
              echo "::notice::Release $GITHUB_REF_NAME already exists; uploading $ZIP."
              gh release upload "$GITHUB_REF_NAME" "$ZIP"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
